# Prüft jeden Push und Pull Request: Typecheck, Lint, Tests (inkl. Barrierefreiheit und
# Verbindungs-Wächter) und Build. Läuft ohne Geheimnisse und ohne private Startdaten.
name: CI

on:
  push:
    branches: [main, 'chore/**', 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
